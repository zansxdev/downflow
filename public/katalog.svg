<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <style>
      .font-sans { font-family: 'Liberation Sans', 'DejaVu Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .font-mono { font-family: 'Liberation Mono', 'DejaVu Sans Mono', monospace; }
    </style>
  </defs>

  <!-- Solid Deep Dark Canvas -->
  <rect width="1080" height="1080" fill="#060709"/>

  <!-- Main Showcase Container Card -->
  <rect x="40" y="40" width="1000" height="1000" rx="28" fill="#0c0d14" stroke="#222332" stroke-width="2"/>

  <!-- Top Header Row -->
  <g transform="translate(80, 78)">
    <!-- App Icon glyph -->
    <rect x="0" y="0" width="46" height="46" rx="13" fill="#181926" stroke="#2d2f44" stroke-width="1.5"/>
    <path d="M 23 11 L 23 30 M 14 22 L 23 31 L 32 22 M 12 37 L 34 37" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Brand Name -->
    <text x="60" y="32" fill="#ffffff" class="font-sans" font-size="27" font-weight="bold" letter-spacing="-0.5">DownFlow</text>

    <!-- Version pill -->
    <rect x="198" y="11" width="54" height="24" rx="12" fill="#1b1c2b" stroke="#31334d" stroke-width="1"/>
    <text x="225" y="27" text-anchor="middle" fill="#a1a1aa" class="font-mono" font-size="11" font-weight="600">v1.2</text>

    <!-- 3 Themes Feature Indicator in Header -->
    <g transform="translate(300, 8)">
      <rect x="0" y="0" width="340" height="30" rx="15" fill="#13141f" stroke="#242638" stroke-width="1"/>
      <!-- Dark chip -->
      <rect x="4" y="4" width="68" height="22" rx="11" fill="#24242e"/>
      <text x="38" y="19" text-anchor="middle" fill="#ffffff" class="font-sans" font-size="11" font-weight="600">Dark</text>
      <!-- Light chip -->
      <rect x="76" y="4" width="68" height="22" rx="11" fill="#ffffff"/>
      <text x="110" y="19" text-anchor="middle" fill="#0f172a" class="font-sans" font-size="11" font-weight="bold">Light</text>
      <!-- Brutal chip -->
      <rect x="148" y="4" width="188" height="22" rx="11" fill="#ffe600"/>
      <text x="242" y="19" text-anchor="middle" fill="#000000" class="font-sans" font-size="11" font-weight="bold">⚡ Neo-Brutalism</text>
    </g>

    <!-- Creator Badge on right -->
    <g transform="translate(755, 8)">
      <rect x="0" y="0" width="165" height="30" rx="15" fill="#151624" stroke="#292b3f" stroke-width="1.2"/>
      <circle cx="20" cy="15" r="4" fill="#10b981"/>
      <text x="32" y="20" fill="#e4e4e7" class="font-mono" font-size="13" font-weight="600">@zansxart</text>
    </g>
