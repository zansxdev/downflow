  <!-- Main Hero Titles -->
  <text x="540" y="205" text-anchor="middle" fill="#ffffff" class="font-sans" font-size="44" font-weight="800" letter-spacing="-1.2">
    Universal Media Downloader
  </text>
  <text x="540" y="244" text-anchor="middle" fill="#94a3b8" class="font-sans" font-size="16" font-weight="500">
    Unduh video, musik, dan foto kualitas HD dari semua platform tanpa iklan &amp; tanpa watermark
  </text>

  <!-- Website Input Bar Mockup -->
  <g transform="translate(80, 275)">
    <rect width="920" height="62" rx="18" fill="#11121a" stroke="#2a2c3d" stroke-width="1.5"/>
    <!-- Link Icon -->
